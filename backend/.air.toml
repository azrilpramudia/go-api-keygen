root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  delay = 500
  exclude_dir = ["tmp", "vendor", "node_modules"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "env"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true